{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Swetha M | Python Full Stack Developer{% endblock %}</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <!-- LOGO -->
        <a href="{% url 'home' %}" class="nav-logo">
            Swetha M<span>.dev</span>
        </a>

        <!-- PORTFOLIO NAVIGATION LINKS -->
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
            <a href="#education">Education</a>
            <a href="#contact">Contact</a>
        </div>

        <!-- RIGHT SIDE CONTACT ACTION -->
        <div class="nav-actions">
            <a href="#contact" class="nav-contact">
                <i class="bi bi-envelope-fill"></i> Contact Me
            </a>
        </div>
    </nav>

    <!-- ================= PAGE CONTENT ================= -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script src="{% static 'main/js/script.js' %}"></script>

</body>
</html>
